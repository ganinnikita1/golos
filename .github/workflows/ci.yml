name: CI

# ЦЕЛЬ: прогон быстрых тестов на Windows для push в main и для PR.
#
# Модель безопасности этого workflow:
#   * НЕТ pull_request_target — код из fork-PR не получает доступ к секретам;
#   * GITHUB_TOKEN только на чтение (contents: read), секретов в workflow нет;
#   * все actions закреплены по полному commit SHA (тег может переехать, SHA — нет);
#   * checkout с persist-credentials: false — токен не остаётся в .git/config
#     и не может быть увезён из PR-кода;
#   * артефакты не выгружаются, в логи не печатаются env/токены;
#   * зафиксирован timeout, чтобы fork-PR не жёг минуты бесконечно.
#
# ВАЖНО: для fork-PR GitHub берёт определение workflow из merge-коммита PR,
# поэтому PR может менять сам CI. Поэтому в настройках репозитория нужно включить
# "Require approval for all outside collaborators" (настройка репозитория),
# а секреты в pull_request-workflow НЕ добавлять никогда.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (windows, python 3.13)
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      QT_QPA_PLATFORM: offscreen
      HF_HUB_DISABLE_TELEMETRY: "1"
      # не тянуть новую версию pip-а на каждом запуске
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout
        # actions/checkout v4.4.0, SHA сверен по API 2026-11-11
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python v5.6.0, SHA сверен по API 2026-11-11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Pin build tooling
        # Без этого pip тянет самый свежий setuptools/wheel при каждой сборке,
        # а pip install --upgrade pip — самый свежий pip (supply-chain дрейф).
        run: |
          python -m pip install --upgrade "pip==26.2.1" "setuptools==78.1.0" "wheel==0.45.1"

      - name: Install CPU PyTorch
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0 torchaudio==2.8.0

      - name: Install project
        # Если в репозитории появился lock-файл с хешами (см.
        # requirements/README.md) — ставим строго по нему.
        # Пока его нет — устанавливаем проект, но без build-isolation (setuptools/wheel
        # уже закреплены выше, поэтому ничего не докачивается из PyPI в процессе сборки).
        run: |
          if (Test-Path "requirements/pypi.lock") {
            python -m pip install --require-hashes -r "requirements/pypi.lock"
            python -m pip install -e ".[dev]" --no-build-isolation --no-deps
          } else {
            python -m pip install -e ".[dev]" --no-build-isolation
          }

      - name: Show environment
        run: |
          python --version
          python -m pip list --format=columns | Select-String -Pattern "torch|transformers|PySide|pytest|sounddevice"

      - name: Run fast tests
        run: python -m pytest tests -m "not slow" -q

      - name: Syntax check (compileall)
        run: python -m compileall -q golos
