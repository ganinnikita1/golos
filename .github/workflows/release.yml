name: Release

# ВЫПУСК: запускается ТОЛЬКО по push тега v* (теги создаёт владелец, см. ruleset-tags.json).
# Отличие от CI: здесь есть write-права на создание Release, поэтому workflow
# не должен запускаться на pull_request/pull_request_target ни при каких условиях.
#
# Что делает:
#   1) пересобирает проект из тега и прогоняет тесты (артефакт строится из проверенного кода);
#   2) собирает portabe-zip PyInstaller и SHA256SUMS.txt;
#   3) выпускает Sigstore-аттестацию (provenance) для zip и SUMS;
#   4) создаёт GitHub Release, прикрепляя zip + SHA256SUMS.txt.
# Бинарники остаются в Release, в git их не коммитим.
#
# ПРЕДУСЛОВИЯ (сделать один раз, до первого релиза):
#   * включить "Immutable releases" (см. github-hardening.ps1);
#   * включить Actions permission: contents: write только этому workflow (permissions ниже);
#   * применить ruleset-tags.json, чтобы тег нельзя было переписать;
#   * проверить этот workflow на тестовом теге (v0.1.1-rc1), не на боевом.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: build + attest + release
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write        # создать GitHub Release и приложить ассеты
      id-token: write        # Sigstore OIDC для attest-build-provenance
      attestations: write    # записать build provenance
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout (tag, полная история)
        # actions/checkout v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python v5.6.0
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Pin build tooling
        run: |
          python -m pip install --upgrade "pip==26.2.1" "setuptools==78.1.0" "wheel==0.45.1"

      - name: Install CPU PyTorch
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0 torchaudio==2.8.0

      - name: Install project
        # см. security-audit/proposed/requirements/README-lock.md
        run: |
          if (Test-Path "requirements/pypi.lock") {
            python -m pip install --require-hashes -r "requirements/pypi.lock"
            python -m pip install -e ".[dev]" --no-build-isolation --no-deps
          } else {
            python -m pip install -e ".[dev]" --no-build-isolation
          }

      - name: Tests before packaging
        run: python -m pytest tests -m "not slow" -q

      - name: Build portable app
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging\build.ps1

      - name: Package + SHA256SUMS
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = "dist\Golos-portable-$tag.zip"
          Compress-Archive -Path "dist\Golos" -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLower()
          "$hash *Golos-portable-$tag.zip" | Set-Content -Encoding ascii "dist\SHA256SUMS.txt"
          Get-Content "dist\SHA256SUMS.txt"

      - name: Attest build provenance
        # actions/attest-build-provenance v4.2.2, SHA сверен по API 2026-11-11
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            dist/Golos-portable-*.zip
            dist/SHA256SUMS.txt

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag `
            "dist/Golos-portable-$tag.zip" `
            "dist/SHA256SUMS.txt" `
            --title "Голос $tag" `
            --generate-notes `
            --verify-tag
