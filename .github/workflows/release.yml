name: Release

# ВЫПУСК: запускается ТОЛЬКО по push тега v* (теги создаёт владелец; ruleset-tags.json
# запрещает перезапись/удаление тегов и создание кем угодно, кроме admin).
#
# Порядок (best practice GitHub для immutable releases):
#   1) собрать из тега и прогнать тесты;
#   2) почистить __pycache__/dev-мусор из dist и проверить отсутствие путей сборочной машины;
#   3) собрать portable-zip (flat top-level: Golos.exe + _internal) и source-zip (git archive);
#   4) SHA256SUMS-<tag>.txt на оба архива + Sigstore-attestation;
#   5) создать ЧЕРНОВИК релиза, приложить все ассеты, затем опубликовать
#      (при включённой immutable releases GitHub дополнительно создаст release-attestation).
#
# ПРЕДУСЛОВИЯ:
#   * immutable releases включены (см. IMMUTABLE-RELEASES.md);
#   * actions permissions: selected + sha_pinning_required (только GitHub-owned actions);
#   * теги подписываются владельцем (SSH/GPG) — тогда шаг verify-tag станет обязательным.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: build + attest + release
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write        # GitHub Release
      id-token: write        # Sigstore OIDC
      attestations: write    # build provenance
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout (tag, полная история)
        # actions/checkout v4.4.0 — SHA сверен по API 2026-11-11
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python v5.6.0
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Проверка тега
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          git rev-parse --verify "refs/tags/$tag^{commit}" | Out-Null
          # Подпись тега: если теги подписываются — этот шаг должен падать при bad signature.
          # Пока теги неподписаны, ограничиваемся предупреждением.
          $verify = git verify-tag $tag 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Тег $tag не подписан (git verify-tag: $verify). Подписывайте релизные теги."
          } else {
            Write-Host "Подпись тега $tag проверена." -ForegroundColor Green
          }

      - name: Pin build tooling
        run: |
          python -m pip install --upgrade "pip==26.2.1" "setuptools==78.1.0" "wheel==0.45.1"

      - name: Install CPU PyTorch
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0 torchaudio==2.8.0

      - name: Install project
        run: |
          if (Test-Path "requirements/pypi.lock") {
            python -m pip install --require-hashes -r "requirements/torch.lock"
            python -m pip install --require-hashes -r "requirements/pypi.lock"
            python -m pip install -e ".[dev]" --no-build-isolation --no-deps
          } else {
            python -m pip install -e ".[dev]" --no-build-isolation
          }

      - name: Tests before packaging
        run: python -m pytest tests -m "not slow" -q

      - name: Build portable app
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging\build.ps1

      - name: Clean dist (no __pycache__, no build-machine paths)
        shell: pwsh
        run: |
          $dist = "dist\Golos"
          Get-ChildItem -Path $dist -Recurse -Directory -Filter "__pycache__" -ErrorAction SilentlyContinue |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Path $dist -Recurse -File -Include *.pyc -ErrorAction SilentlyContinue |
            Remove-Item -Force -ErrorAction SilentlyContinue
          # Защита от PII: в артефакт не должны попадать абсолютные пути сборочной машины.
          $hits = Get-ChildItem -Path $dist -Recurse -File |
            Select-String -Pattern 'C:\\Users\\' -SimpleMatch -List -ErrorAction SilentlyContinue
          if ($hits) {
            $hits | ForEach-Object { Write-Warning "build path in $($_.Path): $($_.Line)" }
            throw "В dist найдены абсолютные пути C:\Users\ — сборка не годится для публикации."
          }

      - name: Package portable zip (flat) + source zip + SHA256SUMS
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $portable = "dist\Golos-portable-$tag.zip"
          # ВАЖНО: "dist\Golos\*" — чтобы top-level был flat (Golos.exe + _internal),
          # как в v0.1.1; "dist\Golos" добавил бы вложенную папку Golos\.
          Compress-Archive -Path "dist\Golos\*" -DestinationPath $portable -CompressionLevel Optimal
          git archive --format=zip --prefix="golos-$tag/" -o "dist\golos-$tag-source.zip" "v$tag"
          $sums = "dist\SHA256SUMS-$tag.txt"
          @(
            (Get-FileHash -Path $portable -Algorithm SHA256).Hash.ToLower() + " *Golos-portable-$tag.zip",
            (Get-FileHash -Path "dist\golos-$tag-source.zip" -Algorithm SHA256).Hash.ToLower() + " *golos-$tag-source.zip"
          ) | Set-Content -Encoding ascii $sums
          Get-Content $sums

      - name: Attest build provenance
        # actions/attest-build-provenance v4.2.2 — SHA сверен по API 2026-11-11
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            dist/Golos-portable-*.zip
            dist/golos-*-source.zip
            dist/SHA256SUMS-*.txt

      - name: Create DRAFT release (assets first)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag --draft `
            "dist/Golos-portable-$tag.zip" `
            "dist/golos-$tag-source.zip" `
            "dist/SHA256SUMS-$tag.txt" `
            --title "Голос $tag" `
            --generate-notes `
            --verify-tag

      - name: Publish release (immutability applies here)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release edit $tag --draft=false
